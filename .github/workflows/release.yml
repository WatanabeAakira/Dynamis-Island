name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release yang akan dibangun ulang'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Ambil source code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Siapkan .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependency
        run: npm ci

      # Bikin satu release dulu supaya beberapa aset yang di-upload barengan
      # electron-builder masuk ke release yang sama, bukan bikin release duplikat.
      - name: Siapkan satu GitHub Release
        shell: pwsh
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"

          try {
            $release = Invoke-RestMethod -Uri "$api/tags/$tag" -Headers $headers
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -ne 404) { throw }

            $notes = "releases/$tag.md"
            $body = if (Test-Path $notes) { [IO.File]::ReadAllText((Resolve-Path $notes)) } else { "Dynamis Island $tag" }
            $payload = @{ tag_name = $tag; target_commitish = "main"; name = "Dynamis Island $tag"; body = $body; draft = $true } | ConvertTo-Json -Compress
            $release = Invoke-RestMethod -Uri $api -Method Post -Headers $headers -ContentType "application/json" -Body $payload
          }

          foreach ($asset in @($release.assets)) {
            if ($asset.name -match '^Dynamis-Island-Setup-.*\.(exe|exe\.blockmap|yml)$') {
              Invoke-RestMethod -Uri "$api/assets/$($asset.id)" -Method Delete -Headers $headers
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Build installer Windows
        run: npm run build:win

      - name: Upload aset GitHub Releases
        shell: pwsh
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $release = Invoke-RestMethod -Uri "$api/tags/$tag" -Headers $headers
          $uploadBase = $release.upload_url -replace '\{.*$',''

          $version = if ($tag.StartsWith('v')) { $tag.Substring(1) } else { $tag }
          $assets = @(
            @{ Path = "dist/Dynamis-Island-Setup-$version.exe"; Type = "application/octet-stream" },
            @{ Path = "dist/Dynamis-Island-Setup-$version.exe.blockmap"; Type = "application/octet-stream" },
            @{ Path = "dist/latest.yml"; Type = "application/octet-stream" }
          )

          foreach ($asset in $assets) {
            $path = Resolve-Path -LiteralPath $asset.Path
            $name = [IO.Path]::GetFileName($path)
            $encodedName = [Uri]::EscapeDataString($name)
            Invoke-RestMethod -Uri "$uploadBase`?name=$encodedName" -Method Post -Headers $headers -ContentType $asset.Type -InFile $path
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Publikasikan GitHub Release
        shell: pwsh
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $release = Invoke-RestMethod -Uri "$api/tags/$tag" -Headers $headers
          $payload = @{ draft = $false } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "$api/$($release.id)" -Method Patch -Headers $headers -ContentType "application/json" -Body $payload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
